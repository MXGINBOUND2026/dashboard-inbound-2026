name: Auto Update Parquet Pipeline

on:
  workflow_dispatch: # Mengizinkan Anda menjalankan proses dari tab Actions kapan saja

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install gdown duckdb google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Generate credentials.json
        run: |
          echo '${{ secrets.GDRIVE_CREDENTIALS }}' > credentials.json

      - name: Run Convert Script
        run: |
          python convert_to_parquet.py
