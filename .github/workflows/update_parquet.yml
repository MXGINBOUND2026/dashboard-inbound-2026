name: Auto Update Parquet Pipeline

on:
  workflow_dispatch: # Mengizinkan Anda menjalankan proses dari tab Actions kapan saja

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install gdown duckdb google-api-python-client google-auth-httplib2 google-auth-oauthlib pyarrow

      - name: Run Convert Script
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          python convert_to_parquet.py
